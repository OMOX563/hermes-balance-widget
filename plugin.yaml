name: hermes-balance-widget
version: "1.1.4"
description: "Nine AI provider balances in one desktop widget — live balance/usage, token-cost estimates with off-peak price windows, and a per-provider anime mascot with rotating flavour lines (DeepSeek, MiniMax, GLM, Kimi, MiMo, ChatGPT, Claude, Gemini, Grok). Desktop-only: desktop/plugin.js inside the plugin SDK surface; no agent tools, hooks, middleware or env vars. Keys are entered by the user in the plugin's settings page and stored in plugin-scoped storage; the widget only calls the provider APIs those keys belong to."
